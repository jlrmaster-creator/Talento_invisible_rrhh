name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos: solo hace falta publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# No permite dos publicaciones simultaneas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Publicacion en un proyecto de GitHub Pages: /<nombre-del-repo>/
          # Para un dominio propio, deja BASE_PATH vacio o ponlo en "/".
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Si Pages aun no esta activado en el repositorio, lo activa con
          # origen GitHub Actions (requiere el permiso pages: write).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
